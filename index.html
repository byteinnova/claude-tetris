<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <header class="game-header">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-toggle">
        <span>OSCURO</span>
        <input type="checkbox" id="theme-switch" aria-label="Alternar modo claro / oscuro" />
        <span class="switch"></span>
        <span>CLARO</span>
      </label>
    </header>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>
        <div class="panel-section">
          <span class="label">MAX LINES</span>
          <span class="value" id="max-lines">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>

          <div id="hs-name-section" class="hs-name-section hidden">
            <p class="hs-name-label">Nuevo record — ingresa tu nombre:</p>
            <div class="hs-name-row">
              <input type="text" id="hs-name-input" maxlength="16" placeholder="Nombre" />
              <button id="hs-save-btn">Guardar</button>
            </div>
          </div>

          <div id="hs-section" class="hs-section hidden">
            <div class="hs-header-row">
              <span class="label">TOP 5</span>
              <button id="clear-hs-btn" class="clear-hs-btn">Borrar records</button>
            </div>
            <table class="hs-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Nombre</th>
                  <th>Puntaje</th>
                  <th>Max/Combo</th>
                </tr>
              </thead>
              <tbody id="hs-tbody"></tbody>
            </table>
          </div>

          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
